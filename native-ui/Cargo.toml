[package]
name = "rve-native"
version = "2.4.37"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui-lucide = "0.2"
serde_json = "1.0"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
