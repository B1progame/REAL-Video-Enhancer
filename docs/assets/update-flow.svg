<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">In-app update steps</title>
  <desc id="desc">Check for updates in Settings, download the release installer from GitHub, launch it, and return to the updated app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6f7"/><stop offset="1" stop-color="#e9f0f1"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08c9c9"/><stop offset="1" stop-color="#21ded1"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8fa7aa"/></marker>
    <style>text{font-family:Inter,'Segoe UI',Arial,sans-serif}.n{fill:#8aa0a4;font-size:13px;font-weight:700;letter-spacing:1.5px}.h{fill:#15272e;font-size:18px;font-weight:650}.p{fill:#586e74;font-size:14px}</style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <path d="M270 138h125M550 138h125M830 138h125" fill="none" stroke="#8fa7aa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="32" y="45" width="238" height="185" rx="18" fill="#fff" stroke="#dce5e6"/>
    <circle cx="65" cy="81" r="17" fill="#dff9f5"/><text x="65" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#068f88">1</text>
    <text x="92" y="86" class="n">SETTINGS</text><text x="54" y="133" class="h">Check releases</text><text x="54" y="165" class="p">Compare installed and</text><text x="54" y="187" class="p">latest versions.</text>
  </g>
  <g>
    <rect x="312" y="45" width="238" height="185" rx="18" fill="#fff" stroke="#dce5e6"/>
    <circle cx="345" cy="81" r="17" fill="#dff9f5"/><text x="345" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#068f88">2</text>
    <text x="372" y="86" class="n">GITHUB</text><text x="334" y="133" class="h">Download installer</text><text x="334" y="165" class="p">Fetch the Windows asset</text><text x="334" y="187" class="p">from your release channel.</text>
  </g>
  <g>
    <rect x="592" y="45" width="238" height="185" rx="18" fill="#fff" stroke="#dce5e6"/>
    <circle cx="625" cy="81" r="17" fill="#dff9f5"/><text x="625" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#068f88">3</text>
    <text x="652" y="86" class="n">INSTALLER</text><text x="614" y="133" class="h">Install the update</text><text x="614" y="165" class="p">The current app closes;</text><text x="614" y="187" class="p">the per-user installer runs.</text>
  </g>
  <g>
    <rect x="872" y="45" width="296" height="185" rx="18" fill="#15323a" stroke="#15323a"/>
    <circle cx="905" cy="81" r="17" fill="url(#accent)"/><text x="905" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0e3032">4</text>
    <text x="932" y="86" class="n" fill="#93dcd7">BACK IN RVE</text><text x="894" y="133" class="h" fill="#f5fbfa">Keep working</text><text x="894" y="165" class="p" fill="#b2c8c9">Settings and models stay</text><text x="894" y="187" class="p" fill="#b2c8c9">in their existing locations.</text>
  </g>
  <rect x="32" y="258" width="1136" height="4" rx="2" fill="#d2e1e2"/><rect x="32" y="258" width="1136" height="4" rx="2" fill="url(#accent)"/>
</svg>
